services:
  api:
    build: .
    image: pulseml:latest
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs:ro
    restart: unless-stopped

  dashboard:
    build: .
    image: pulseml:latest
    depends_on:
      - api
    command: ["streamlit", "run", "app/dashboard.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - ./outputs:/app/outputs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped
